version: 2

project_name: pocketbase-postgres

dist: .builds

before:
  hooks:
    - go mod tidy

builds:
  - id: build_noncgo
    main: ./examples/base
    binary: pocketbase
    ldflags:
      - -s -w -X github.com/pocketbase/pocketbase.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - s390x
      - ppc64le
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: ppc64le
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: ppc64le

# Container images published to the GitHub Container Registry.
#
# One image per architecture, then a manifest that joins them so that
# "docker pull ghcr.io/mwakalinga/pocketbase-postgres:<tag>" resolves to the
# right one. goreleaser skips pushing for --snapshot builds.
dockers:
  - id: image_amd64
    ids: [build_noncgo]
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/mwakalinga/pocketbase-postgres:{{ .Version }}-amd64"
      - "ghcr.io/mwakalinga/pocketbase-postgres:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: image_arm64
    ids: [build_noncgo]
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/mwakalinga/pocketbase-postgres:{{ .Version }}-arm64"
      - "ghcr.io/mwakalinga/pocketbase-postgres:latest-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/mwakalinga/pocketbase-postgres:{{ .Version }}"
    image_templates:
      - "ghcr.io/mwakalinga/pocketbase-postgres:{{ .Version }}-amd64"
      - "ghcr.io/mwakalinga/pocketbase-postgres:{{ .Version }}-arm64"
  - name_template: "ghcr.io/mwakalinga/pocketbase-postgres:latest"
    image_templates:
      - "ghcr.io/mwakalinga/pocketbase-postgres:latest-amd64"
      - "ghcr.io/mwakalinga/pocketbase-postgres:latest-arm64"

release:
  draft: true

archives:
  - id: archive_noncgo
    builds: [build_noncgo]
    format: zip
    files:
      - LICENSE.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^examples:'
      - '^ui:'
