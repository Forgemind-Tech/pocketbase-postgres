# Production bundle: PocketBase + PostgreSQL.
#
#   cp .env.example .env     # then edit it
#   docker compose -f docker-compose.prod.yml up -d
#
# Separate from docker-compose.yml, which is the development/test setup. Keeping
# them apart means a stray "docker compose up" in this directory cannot touch a
# deployed stack, and vice versa.
#
# See POSTGRES.md for backups, failover and the connection settings.

name: pocketbase

services:
  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pocketbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pocketbase}
    # Caps, not reservations: they stop a runaway container taking the host
    # down, they do not reserve anything. Set them too low and the kernel will
    # OOM-kill the database, so tune in .env rather than trimming blindly.
    deploy:
      resources:
        limits:
          cpus: "${PG_CPU_LIMIT:-1.0}"
          memory: ${PG_MEM_LIMIT:-1g}
          pids: 512
    # hardening: Postgres needs CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER to
    # initialise its data directory and drop to the postgres user
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      # note: postgres:18+ expects a single mount at /var/lib/postgresql and
      # places the cluster in a major-version subdirectory beneath it
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pocketbase} -d ${POSTGRES_DB:-pocketbase}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    # deliberately NOT published to the host - only the app needs to reach it,
    # and it does so over the internal compose network

  pocketbase:
    # published by the release workflow to the GitHub Container Registry, so a
    # deployment needs only this file and .env - no source checkout
    #
    # to run a locally built image instead:
    #   docker build -t ghcr.io/forgemind-tech/pocketbase-postgres:local .
    #   PB_IMAGE_TAG=local docker compose -f docker-compose.prod.yml up -d
    image: ghcr.io/forgemind-tech/pocketbase-postgres:${PB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        # waits for the healthcheck, not just for the container to exist
        condition: service_healthy
    environment:
      # "postgres" is the service name on the compose network
      PB_DB_URL: postgres://${POSTGRES_USER:-pocketbase}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pocketbase}?sslmode=disable
      # optional - upstream PocketBase does not encrypt settings by default
      # either. When set it must be exactly 32 characters and encrypts the
      # stored SMTP/S3 credentials; losing it makes those unreadable.
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
    # the image already defaults to "serve --http=0.0.0.0:8090" through an
    # entrypoint that adds the four --*Dir flags and, when a key is set,
    # --encryptionEnv
    #
    # Runs as the host user that owns the bind-mounted directories below.
    # Without this the container's own "pb" user (101:102) cannot write to
    # directories owned by you, and on Linux the server fails to start. Docker
    # Desktop on macOS/Windows papers over ownership, which is exactly why this
    # must be set explicitly rather than discovered by testing there.
    #
    # Find yours with:  id -u  and  id -g
    user: "${PB_UID:-101}:${PB_GID:-102}"
    deploy:
      resources:
        limits:
          cpus: "${PB_CPU_LIMIT:-1.0}"
          memory: ${PB_MEM_LIMIT:-512m}
          pids: 256
    # hardening: the app needs no extra privileges and no capabilities.
    # It writes only to the four directories below.
    #
    # Note that pb_hooks is executable JS loaded into the server process, so
    # whoever can write to that directory on the host can run code inside this
    # container. That is how PocketBase works and the container limits still
    # apply, but it is worth knowing before making the directory group-writable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${PB_PORT:-8090}:8090"
    volumes:
      # Bind mounts rather than named volumes, so the layout matches a plain
      # binary install and you can edit hooks, migrations and static files with
      # your own editor. Create them before the first start, or Docker creates
      # them root-owned and the container cannot write to them.
      #
      # pb_data holds uploads, backups and types.d.ts. Your records live in
      # Postgres, so this directory alone is NOT a complete backup.
      - ./pb_data:/pb_data
      - ./pb_hooks:/pb_hooks
      - ./pb_migrations:/pb_migrations
      - ./pb_public:/pb_public

volumes:
  pgdata:
